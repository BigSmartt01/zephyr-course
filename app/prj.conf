CONFIG_LOG=y
CONFIG_I2C=y
CONFIG_I2C_SHELL=y
CONFIG_GPIO=y
CONFIG_GPIO_SHELL=y
CONFIG_SENSOR=y
CONFIG_SENSOR_SHELL=y


CONFIG_OUR_DRIVER=y
CONFIG_BLINK_SPEED_2000MS=y

#Shell on the default UART console
CONFIG_SHELL=y

#Enable the Ztest unit testing framework
CONFIG_ZTEST=y

#Randomize suite and test order to catch ordering dependencies early
CONFIG_ZTEST_SAMPLE=y